{% if articles_page and articles_page.has_other_pages() %}
<nav class="pagination" aria-label="Pagination">
  {% if articles_page.has_previous() %}
  <a class="btn btn--ghost" href="{{ SITEURL }}/{{ articles_previous_page.url }}">&larr; Newer</a>
  {% else %}
  <span></span>
  {% endif %}

  <span class="pagination__count">{{ articles_page.number }} / {{ articles_paginator.num_pages }}</span>

  {% if articles_page.has_next() %}
  <a class="btn btn--ghost" href="{{ SITEURL }}/{{ articles_next_page.url }}">Older &rarr;</a>
  {% else %}
  <span></span>
  {% endif %}
</nav>
{% endif %}
